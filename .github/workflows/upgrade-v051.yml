name: Build LeafReader v0.5.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaf-v051-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-and-build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PREFERRED_XCODE: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply readable source upgrade and archive sources
        run: |
          python3 -m py_compile LeafReader-v0.5.1-upgrade.py
          python3 LeafReader-v0.5.1-upgrade.py --project . --archive dist/LeafReader-v0.5.1-source.zip
      - name: Upload complete upgraded source before tests
        uses: actions/upload-artifact@v4
        with:
          name: LeafReader-v0.5.1-complete-source
          path: |
            dist/LeafReader-v0.5.1-source.zip
            .leaf-upgrade-backup/**/payload-sha256.json
            .leaf-upgrade-backup/**/change-manifest.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify project scripts and installer regression tests
        run: |
          python3 scripts/check_project.py
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/build-ios.sh scripts/test-ios.sh
      - name: Compile shared UI and run regression tests
        run: bash ./gradlew :shared:desktopTest -PenableApple=false --stacktrace
      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "$PREFERRED_XCODE" ]; then
            echo "DEVELOPER_DIR=$PREFERRED_XCODE" >> "$GITHUB_ENV"
          else
            python3 - <<'PY'
          import os, pathlib, re
          apps = list(pathlib.Path('/Applications').glob('Xcode*.app'))
          if not apps:
              raise SystemExit('No Xcode application found')
          apps.sort(key=lambda p: tuple(int(n) for n in re.findall(r'\d+', p.name)))
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('DEVELOPER_DIR=' + str(apps[-1] / 'Contents/Developer') + '\n')
          PY
          fi
      - name: Inspect Apple tools and install XcodeGen
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
      - name: Build and package device IPA
        run: bash scripts/build-ios.sh
      - name: Upload IPA before native test execution
        id: upload_ipa
        uses: actions/upload-artifact@v4
        with:
          name: LeafReader-v0.5.1-iOS16-arm64-unsigned
          path: |
            dist/*.ipa
            dist/*.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Run native streaming importer tests
        run: bash scripts/test-ios.sh
      - name: Run Kotlin Native reduced-motion simulator tests
        if: ${{ always() && !cancelled() && steps.upload_ipa.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != arm64 ]; then
            echo 'Kotlin Native iOS simulator tests SKIPPED: this task requires an arm64 macOS runner.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DEVICES_JSON="$RUNNER_TEMP/leaf-v051-simulators.json"
          if ! xcrun simctl list devices available --json > "$DEVICES_JSON"; then
            echo 'Kotlin Native iOS simulator tests SKIPPED: simulator inventory is unavailable.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          LEAF_SIMULATOR_UDID="$(python3 - "$DEVICES_JSON" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as source:
              devices = json.load(source).get('devices', {})
          candidates = [device for runtime, values in devices.items() if 'iOS' in runtime
                        for device in values if device.get('isAvailable') and device.get('name', '').startswith('iPhone')]
          candidates.sort(key=lambda device: (device.get('state') != 'Booted', device.get('name', ''), device.get('udid', '')))
          print(candidates[0]['udid'] if candidates else '')
          PY
          )"
          if [ -z "$LEAF_SIMULATOR_UDID" ]; then
            echo 'Kotlin Native iOS simulator tests SKIPPED: no available iPhone simulator/runtime.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export LEAF_SIMULATOR_UDID
          xcrun simctl bootstatus "$LEAF_SIMULATOR_UDID" -b
          INIT_SCRIPT="$RUNNER_TEMP/leaf-v051-simulator.init.gradle"
          python3 - "$INIT_SCRIPT" <<'PY'
          import pathlib, sys
          pathlib.Path(sys.argv[1]).write_text('''gradle.projectsEvaluated {
              gradle.rootProject.project(':shared').tasks.named('iosSimulatorArm64Test').configure { task ->
                  task.device.set(System.getenv('LEAF_SIMULATOR_UDID'))
              }
          }
          ''', encoding='utf-8')
          PY
          bash ./gradlew :shared:iosSimulatorArm64Test -PenableApple=true --init-script "$INIT_SCRIPT" --stacktrace
          echo 'Kotlin Native iOS simulator tests executed successfully; see test reports for actual cases.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload all test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeafReader-v0.5.1-test-reports
          path: |
            shared/build/reports/tests/
            build/ParserTests.xcresult
          if-no-files-found: ignore
      - name: Summary
        if: always()
        run: |
          echo '### LeafReader v0.5.1' >> "$GITHUB_STEP_SUMMARY"
          echo 'Upgraded source and payload hashes are published before tests. IPA is available only if the build step succeeded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preserve the Bundle ID and install over the previous version. Verify reduced motion, touch targets, cover contrast and reading gestures on iOS16 hardware.' >> "$GITHUB_STEP_SUMMARY"
